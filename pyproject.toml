[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-recorder"
version = "0.1.0"
description = "SITE-Bench data-collection recorder: records browsing in a dedicated Chrome/Edge profile and exports sessions as .zip files"
readme = "README.md"
requires-python = ">=3.10"  # installers use a uv-managed 3.13 (Tk 9 needs >=3.13)
dependencies = [
    "warcio>=1.7",     # WARC writer for the network archive
    "psutil>=5.9",     # browser / host process tracking
    "pillow>=10.0",    # re-encode the rare JPEG screenshot to PNG
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
site-recorder = "site_recorder.cli:main"

[project.gui-scripts]
# No console window on Windows (pythonw); same app as `site-recorder gui`.
site-recorder-gui = "site_recorder.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"site_recorder" = ["extension/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
