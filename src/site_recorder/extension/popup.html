<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2330;
      --muted: #6b7280;
      --card: #f4f5f7;
      --border: #e3e5ea;
      --rec: #e5484d;
      --rec-bg: #fdecec;
      --pause: #6b7280;
      --pause-bg: #eef0f3;
      --accent: #3b4cca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d24;
        --fg: #f0f1f4;
        --muted: #9aa0ab;
        --card: #23262f;
        --border: #313643;
        --rec-bg: #3a1f22;
        --pause-bg: #2a2d36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 248px;
      font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 14px;
    }
    .title { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .status {
      display: flex; align-items: center; gap: 8px;
      margin: 12px 0; padding: 9px 11px;
      border-radius: 9px; background: var(--card);
      border: 1px solid var(--border);
      font-size: 12.5px; font-weight: 600;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .status.recording .dot { background: var(--rec); box-shadow: 0 0 0 3px var(--rec-bg); animation: pulse 1.6s infinite; }
    .status.paused .dot { background: var(--pause); box-shadow: 0 0 0 3px var(--pause-bg); }
    .status.off .dot { background: #b6bbc4; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    button {
      width: 100%; padding: 10px 12px; border: 0; border-radius: 9px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      color: #fff; background: var(--accent);
      transition: filter .12s ease;
    }
    button:hover { filter: brightness(1.07); }
    button:disabled { background: #b6bbc4; cursor: default; filter: none; }
    button.resume { background: var(--rec); }
    .hint { font-size: 10.5px; color: var(--muted); margin-top: 9px; line-height: 1.4; }
    .dbg { font-size: 9.5px; color: var(--muted); margin-top: 8px; font-family: ui-monospace, monospace; opacity: .7; word-break: break-all; }
  </style>
</head>
<body>
  <div class="title">SITE Collector</div>
  <div class="subtitle">Recording control</div>

  <div id="status" class="status off">
    <span class="dot"></span>
    <span id="status-text">Checking…</span>
  </div>

  <button id="toggle" disabled>…</button>
  <div class="hint" id="hint">Pausing stops screenshots, network capture, and input events until you resume.</div>
  <div class="dbg" id="dbg"></div>

  <script src="popup.js"></script>
</body>
</html>
